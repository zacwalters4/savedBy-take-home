<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/index.css"/>
  <!-- Importing the font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Mina"/> 
  <!-- Changed script loading to async so the JS runs after the HTML is done loading -->
  <script src="/app.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
  <title>SavedBy Mock Store</title>
</head>
<body>
  <header>
    <h1>SavedBy Store</h1>
    <!-- I interpreted the cart icon as a button -->
    <button class="cart-button"></button>
  </header>
  <main>
    <input class="product-search" type="text" id="products" placeholder="Search products..." >
    <div class="product-sort-container">
      <h2>Products</h2>
      <!-- Add a product sort selection dropdown to the webpage -->
      <select name="product-sort" id="product-sort">
        <option value="asc">Sort by Price: Low to High</option>
        <option value="desc">Sort by Price: High to Low</option>
      </select>
    </div>
    
    <!-- This container be populated with our product tiles -->
    <div class="products-container"></div>
  </main>
</body>
</html>
